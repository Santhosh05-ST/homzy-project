version: '3.8'

services:

  mysql:
    image: mysql:8.0.36
    container_name: homzy-mysql
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: homzy_db

    ports:
      - "3307:3306"

    volumes:
      - mysql-data:/var/lib/mysql

  backend:
    build: ./homzy-backend/backend

    container_name: homzy-backend

    depends_on:
      - mysql

    ports:
      - "8080:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/homzy_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

      GROQ_API_KEY: ${GROQ_API_KEY}
      MAIL_USERNAME: santhoshsivetbcab@gmail.com
      MAIL_PASSWORD: ihjq lvls vivy vzuh

  frontend:
    build: ./homzy-frontend

    container_name: homzy-frontend

    depends_on:
      - backend

    ports:
      - "5173:80"

volumes:
  mysql-data: